name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to attach the installers to a GitHub Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Python backend ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev]" pyinstaller

      - name: Python tests
        run: pytest -q

      - name: Build backend exe
        run: >
          pyinstaller --noconfirm --onefile --console
          --name blackjack-backend
          --distpath desktop/backend-dist
          run_backend.py

      - name: Backend self-test
        run: desktop\backend-dist\blackjack-backend.exe --self-test

      # ---- Electron front end ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Build installers
        working-directory: desktop
        run: npm run dist:win

      - name: Smoke test the packaged app
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Get-ChildItem "desktop/release/win-unpacked" -Filter "*.exe" | Where-Object { $_.Name -like "Blackjack*" } | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "app did not exit"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "smoke test failed with exit code $($p.ExitCode)"; exit 1 }
          Write-Host "Smoke test passed: Electron started the bundled backend and got a reply"

      - uses: actions/upload-artifact@v4
        with:
          name: BlackjackAssistant-windows
          path: |
            desktop/release/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
